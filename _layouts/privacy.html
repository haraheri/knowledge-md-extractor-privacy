<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description | escape }}" />
    <title>{{ page.title | escape }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #17233d;
        background: #eef3f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        line-height: 1.65;
      }

      main {
        width: min(100% - 32px, 800px);
        margin: 48px auto;
        padding: clamp(24px, 5vw, 56px);
        border: 1px solid #d8e1ed;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgb(23 35 61 / 10%);
      }

      h1,
      h2 {
        line-height: 1.25;
        color: #10203b;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.035em;
      }

      h2 {
        margin-top: 2.25rem;
        padding-top: 0.25rem;
        font-size: 1.3rem;
      }

      a {
        color: #2459d3;
      }

      code {
        padding: 0.12em 0.35em;
        border-radius: 0.3em;
        background: #edf3ff;
        font-size: 0.92em;
      }

      li + li {
        margin-top: 0.55rem;
      }

      @media (max-width: 560px) {
        main {
          width: 100%;
          margin: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
